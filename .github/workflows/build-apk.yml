name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'screencap-server/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x screencap-server/gradlew

      - name: Build APK
        run: |
          cd screencap-server
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCapServer-debug-apk
          path: screencap-server/app/build/outputs/apk/debug/*.apk
          retention-days: 7
