name: Convert TFLite to ONNX

on:
  workflow_dispatch:
  push:
    paths:
      - 'dw_delta_416_v26s.tflite'

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow tf2onnx

      - name: Convert TFLite to ONNX
        id: convert
        run: |
          python convert_tflite_to_onnx.py
          echo "onnx_path=dw_delta_416_v26s.onnx" >> $GITHUB_OUTPUT

      - name: Upload ONNX model
        uses: actions/upload-artifact@v4
        with:
          name: dw_delta_416_v26s-onnx
          path: ${{ steps.convert.outputs.onnx_path }}
          retention-days: 7